<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>치료실 찾아가기</title>
<style>
/* 레이아웃: 세로 사진 한 장이 화면 전체. 맨 위 진행 막대와 번호, 그 아래 화면 가운데에
   어두운 상자에 담은 노란 안내 문구, 아래 1/3 바닥면에만 로드뷰처럼 눕힌 화살표. */
:root {
  --cap-ink: #FFE14D;
  --cap-bg: rgba(8, 12, 14, 0.72);
  --ink: #0b1112;
  --paper: #f6faf8;
  --paper-soft: rgba(246, 250, 248, 0.16);
  --glass: rgba(9, 15, 16, 0.62);
  --glass-line: rgba(246, 250, 248, 0.18);
  --track: rgba(246, 250, 248, 0.3);
  --scrim-top: rgba(5, 10, 11, 0.74);
  --scrim-mid: rgba(5, 10, 11, 0.42);
  --scrim-none: rgba(5, 10, 11, 0);
  --text-shade: rgba(0, 0, 0, 0.6);
  --edge: rgba(8, 14, 15, 0.42);
  --shade: rgba(0, 0, 0, 0.46);
  --guide: #2fae8c;
  --font-ui: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; overflow: hidden; background: var(--ink); }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--ink); color: var(--paper);
  font-family: var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.stage {
  position: relative; height: 100%; width: 100%; max-width: 62.5vh;
  margin-inline: auto; overflow: hidden; background: var(--ink);
  touch-action: manipulation;
}
.shot {
  position: absolute; inset: 0; width: 100%; height: 100%; max-width: none;
  display: block; object-fit: cover; backface-visibility: hidden;
  will-change: transform, opacity; pointer-events: none;
}

/* 위: 진행 막대, 번호, 안내 문구 */
.hud {
  position: absolute; z-index: 5; top: 0; left: 0; right: 0;
  padding: 12px 16px 30px;
  display: flex; flex-direction: column; gap: 10px;
  background: linear-gradient(to bottom, var(--scrim-mid) 0%, var(--scrim-none) 100%);
  pointer-events: none;
}
/* 순서 막대: 사진 한 장 = 한 칸. 누르거나 끌어서 원하는 사진으로 바로 간다 (위아래로 넓게 눌림) */
.seek {
  margin: -12px -16px -10px; padding: 14px 16px 16px;
  pointer-events: auto; cursor: pointer; touch-action: none;
}
.seek:focus-visible { outline: 3px solid var(--paper); outline-offset: -4px; border-radius: 10px; }
.segs { display: flex; gap: 3px; height: 6px; }
.segs i {
  flex: 1; min-width: 0; border-radius: 3px; background: var(--track);
  box-shadow: 0 0 0 1px rgba(5, 10, 11, 0.22);   /* 하얀 천장 위에서도 칸이 보이게 */
  transition: background .25s ease;
}
.seek.dragging .segs i { transition: none; }   /* 끄는 동안에는 바로바로 */
.segs i.done { background: rgba(246, 250, 248, 0.88); }
.segs i.now { background: var(--cap-ink); }
.segs i.aim { background: var(--cap-ink); box-shadow: 0 0 0 2px rgba(255, 225, 77, 0.5); }
.seektip {
  position: absolute; z-index: 7; top: 40px; left: 50%; margin: 0;
  transform: translateX(-50%); max-width: calc(100% - 24px); box-sizing: border-box;
  padding: 8px 14px; border-radius: 12px;
  background: rgba(9, 15, 16, 0.92); border: 1px solid var(--glass-line); box-shadow: 0 6px 16px var(--shade);
  font: 600 15px/1.35 var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  pointer-events: none;
}
.seektip b { margin-right: 8px; color: var(--cap-ink); font-variant-numeric: tabular-nums; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.count {
  flex: none; margin: 0; padding: 5px 11px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--glass-line);
  font: 500 14px/1 var(--font-ui); font-variant-numeric: tabular-nums;
  display: flex; align-items: baseline; gap: 4px;
}
.count b { font-weight: 700; font-size: 16px; }
.count .of { opacity: .6; }
.fname {
  flex: 0 1 auto; min-width: 0; margin: 0; padding: 4px 9px; border-radius: 8px;
  background: var(--glass); border: 1px solid var(--glass-line);
  font: 500 12px/1.3 var(--font-ui);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cap {
  position: absolute; z-index: 5; left: 50%; top: 20%;
  transform: translateX(-50%);
  box-sizing: border-box; width: max-content; max-width: calc(100% - 32px); margin: 0;
  padding: 12px 18px 14px; border-radius: 16px;
  background: var(--cap-bg); box-shadow: 0 6px 18px var(--shade);
  font-weight: 800; font-size: min(28px, 7.18vw); line-height: 1.32; letter-spacing: -0.01em;
  color: var(--cap-ink); text-align: center; text-shadow: 0 1px 2px var(--text-shade);
  word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance;
  pointer-events: none;
}

/* 사진 속 간판 깜빡임: 사진과 똑같이 잘리는 SVG(cover = slice)를 사진 위에 겹친다 */
.marks {
  position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3;
  pointer-events: none; overflow: hidden; transition: opacity .22s ease;
  filter: drop-shadow(0 0 6px rgba(255, 225, 77, 0.85));
}
.stage.fading .marks { opacity: 0; transition-duration: .1s; }
.mark {
  fill: rgba(255, 225, 77, 0.2); stroke: var(--cap-ink); stroke-width: 4px; stroke-linejoin: round;
  vector-effect: non-scaling-stroke; animation: blink 1.2s ease-in-out infinite;
}
.mark.draft { fill: rgba(255, 96, 96, 0.18); stroke: #ff6060; stroke-dasharray: 8 6; animation: none; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

/* 바닥 길 선: 멀어질수록 가늘어지는 하늘색 띠 + 앞으로 흐르는 작은 화살표 */
.paths {
  position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3;
  pointer-events: none; overflow: hidden; transition: opacity .22s ease;
  filter: drop-shadow(0 0 7px rgba(56, 189, 248, 0.85));
}
.stage.fading .paths { opacity: 0; transition-duration: .1s; }
.route {
  fill: rgba(56, 189, 248, 0.42); stroke: rgba(255, 255, 255, 0.92); stroke-width: 2.5px;
  stroke-linejoin: round; vector-effect: non-scaling-stroke;
  pointer-events: visiblePainted; cursor: pointer;   /* 파란 길을 눌러도 다음 사진으로 */
}
.flow { fill: #ffffff; opacity: 0.2; animation: flow 1.6s linear infinite; pointer-events: none; }
@keyframes flow { 0% { opacity: 0.2; } 12% { opacity: 1; } 34% { opacity: 0.2; } 100% { opacity: 0.2; } }
.paths.pulse .route { animation: pulse .45s ease-in-out 2; }
@keyframes pulse { 50% { fill: rgba(56, 189, 248, 0.85); } }

/* PC에서 E 키: 길 선(점 찍기)·깜빡임(네모 끌기) 그리기 */
.stage.editing { cursor: crosshair; touch-action: none; }
.stage.editing .hit, .stage.editing .route, .stage.editing .prev { pointer-events: none; }
.stage.editing .prev { opacity: .35; }
.handle circle { fill: #ffffff; stroke: #0b1112; stroke-width: 2px; vector-effect: non-scaling-stroke; }
.handle text { fill: #0b1112; font-family: var(--font-ui); font-weight: 800; text-anchor: middle; dominant-baseline: central; }
.editbox {
  position: absolute; z-index: 8; left: 10px; right: 10px; top: 10px; margin: 0;
  padding: 10px 12px; border-radius: 14px; background: rgba(9, 15, 16, 0.92); border: 1px solid var(--glass-line);
  display: flex; flex-direction: column; gap: 7px; font: 500 13px/1.4 var(--font-ui); cursor: default;
}
.editbox.low { top: auto; bottom: 10px; }
.editbox b { color: var(--cap-ink); }
.editbox .head { display: flex; align-items: center; gap: 6px; }
.editbox .head b { flex: 1; min-width: 0; font-size: 14px; }
.editbox input {
  width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 8px;
  border: 1px solid var(--glass-line); background: #111a1c; color: var(--paper);
  font: 500 12px/1.3 Consolas, ui-monospace, monospace; -webkit-user-select: text; user-select: text;
}
.editbox .row { display: flex; gap: 6px; }
.editbox button {
  flex: 1; padding: 8px 4px; border-radius: 8px; border: 0; white-space: nowrap;
  background: #2a3436; color: var(--paper); font: 700 13px var(--font-ui); cursor: pointer;
}
.editbox .head button { flex: none; padding: 6px 11px; }
.editbox .mode[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
.editbox .copy { background: var(--cap-ink); color: #1a1600; }
.editbox .tip { color: #c9d3d4; }

/* 아래: 바닥에 눕힌 화살표 */
.ground {
  position: absolute; z-index: 4; left: 50%; bottom: 6px;
  width: min(100%, 520px); max-width: 100%; aspect-ratio: 400 / 320;
  transform: translateX(-50%);
  pointer-events: none;   /* 누르는 곳은 아래 .hit 단추만, 나머지는 밑의 파란 길로 */
}
.ground svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.ground svg, .arrive, .cap { transition: opacity .22s ease; }
.stage.fading .ground svg, .stage.fading .arrive, .stage.fading .cap { opacity: 0; transition-duration: .1s; }
.a-shadow { fill: var(--shade); }
.a-edge { fill: var(--edge); stroke: var(--edge); stroke-width: 12; stroke-linejoin: round; }
.a-body { fill: var(--paper); stroke: var(--paper); stroke-width: 6; stroke-linejoin: round; }
.arrow.main { animation: breathe 1.9s ease-in-out infinite; }
.arrow.main.shake { animation: shake .55s ease-in-out 2; }
@keyframes breathe { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(var(--nx, 0px), var(--ny, -6px)); } }
@keyframes shake {
  0%, 100% { transform: translate(0, 0); }
  35% { transform: translate(calc(var(--nx, 0px) * 2.4), calc(var(--ny, -6px) * 2.4)); }
  65% { transform: translate(0, 0); }
}
.g-fill { fill: var(--paper-soft); }
.g-edge { fill: none; stroke: var(--edge); stroke-width: 9; }
.g-line { fill: none; stroke: var(--paper); stroke-width: 4; }
.hit {
  position: absolute; margin: 0; padding: 0; border: 0; border-radius: 28px;
  background: transparent; cursor: pointer; touch-action: manipulation; pointer-events: auto;
}
.hit:focus-visible { outline: 3px solid var(--paper); outline-offset: -3px; box-shadow: inset 0 0 0 6px var(--edge); }
/* 왼쪽 아래 '이전' 글씨 단추 */
.prev {
  position: absolute; z-index: 6; left: 14px; bottom: 16px;
  min-width: 88px; min-height: 52px; margin: 0; padding: 0 20px; border-radius: 999px;
  background: var(--glass); color: var(--paper); border: 1.5px solid rgba(246, 250, 248, 0.55);
  box-shadow: 0 6px 16px var(--shade);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  font: 700 19px/1 var(--font-ui); letter-spacing: .04em;
  cursor: pointer; touch-action: manipulation;
}
.prev:active { transform: scale(.96); }
.prev:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }
.arrive {
  position: absolute; left: 0; right: 0; top: 18%;
  display: flex; justify-content: center; pointer-events: none;
}
.pill {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 9px 22px 9px 9px; border-radius: 999px;
  background: var(--paper); color: var(--ink); box-shadow: 0 10px 26px var(--shade);
  font: 700 25px/1 var(--font-ui); letter-spacing: .04em;
  animation: pop .5s cubic-bezier(.2, 1.3, .35, 1) both;
}
.tick { position: relative; flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--guide); }
.tick::after {
  content: ""; position: absolute; left: 13px; top: 7px; width: 8px; height: 16px;
  border: solid var(--paper); border-width: 0 4px 4px 0; transform: rotate(45deg);
}
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.hint {
  position: absolute; left: 50%; bottom: 100%; margin: 0;
  transform: translate(-50%, -4px);
  width: max-content; max-width: calc(100% - 32px);
  padding: 11px 16px; border-radius: 14px;
  background: var(--glass); border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  font: 500 16px/1.45 var(--font-ui); text-align: center; text-wrap: balance;
  pointer-events: none;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; }
@media (prefers-reduced-motion: reduce) {
  .arrow.main, .arrow.main.shake, .pill, .mark, .paths.pulse .route { animation: none; }
  .flow { animation: none; opacity: 0.85; }
  .segs i { transition: none; }
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <img class="shot" id="shotA" alt="" draggable="false">
  <img class="shot" id="shotB" alt="" draggable="false">
  <svg class="paths" id="paths" aria-hidden="true" preserveAspectRatio="xMidYMid slice"></svg>
  <svg class="marks" id="marks" aria-hidden="true" preserveAspectRatio="xMidYMid slice"></svg>

  <header class="hud">
    <div class="seek" id="seek" role="slider" tabindex="0" aria-label="사진 순서, 눌러서 바로 가기" aria-valuemin="1">
      <div class="segs" id="segs"></div>
    </div>
    <div class="toprow">
      <p class="count"><b id="cur">1</b><span class="of">/</span><span id="tot">0</span></p>
      <p class="fname" id="fname" hidden></p>
    </div>
  </header>
  <p class="seektip" id="seekTip" hidden></p>

  <p class="cap" id="cap"></p>

  <div class="ground" id="ground">
    <svg viewBox="0 0 400 320" aria-hidden="true" focusable="false">
      <defs>
        <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
      <g class="goal" id="goal">
        <path class="g-fill"/><path class="g-edge"/><path class="g-line"/>
      </g>
      <g class="arrow main" id="mainArrow">
        <path class="a-shadow" transform="translate(0 7)" filter="url(#blur)"/><path class="a-edge"/><path class="a-body"/>
      </g>
    </svg>
    <button class="hit" id="nextBtn" type="button" aria-label="다음 사진"></button>
    <div class="arrive" id="arrive" hidden><span class="pill"><span class="tick" aria-hidden="true"></span>도착</span></div>
    <p class="hint" id="hint" hidden>바닥의 화살표를 누르면<br>다음 사진으로 넘어가요</p>
  </div>
  <button class="prev" id="backBtn" type="button" aria-label="이전 사진" hidden>이전</button>

  <section class="editbox" id="editbox" hidden>
    <div class="head">
      <b><span id="editStep">1</span>번 사진 고치기</b>
      <button type="button" class="mode" id="modePath" aria-pressed="true">길 선</button>
      <button type="button" class="mode" id="modeMarks" aria-pressed="false">깜빡임</button>
      <button type="button" id="editMove" aria-label="이 상자를 아래로">▼</button>
    </div>
    <div class="tip" id="editTip"></div>
    <input id="editOut" readonly value="" aria-label="길순서.txt 의 이 사진 줄">
    <div class="row">
      <button type="button" id="editUndo">하나 지우기</button>
      <button type="button" id="editClear">모두 지우기</button>
      <button type="button" class="copy" id="editCopy">이 줄 복사</button>
      <button type="button" class="copy" id="editCopyAll">전체 복사</button>
    </div>
  </section>

  <p class="sr" id="live" aria-live="polite"></p>
</main>

<script>
/* 파이썬이 채워 넣는 값 */
const ROUTE = ["straight", "straight", "straight", "sright", "sleft", "straight", "straight", "straight", "sleft", "straight", "arrive"];        // 사진마다 방향: straight / left / right / arrive
const CAPTIONS = ["자동문을 통과하세요", "화면의 화살표를 따라가세요", "우체국을 지나쳐가세요", "연결통로를 따라 가세요", "통로를 지나 본관방향으로 가세요", "직진하세요", "화살표를 따라 직진하세요", "린넨실과 노동조합을따라  지나 직진하세요", "사거리에서 왼쪽으로 꺾으세요", "화면의 화살표를 따라 왼쪽으로 들어가세요", "도착입니다. 치료 잘받으세요!"];  // 사진마다 위쪽 안내 문구

const PATHS = [[[[56.4, 96.0], [55.0, 85.8], [52.7, 76.4], [44.4, 72.5], [39.0, 70.0]]], [[[55.6, 92.0], [43.7, 83.1], [38.8, 76.1], [40.1, 68.5], [42.1, 62.6], [41.8, 57.1], [37.9, 54.4]]], [[[54.7, 94.8], [53.3, 84.1], [51.9, 74.6], [50.1, 67.2], [48.8, 62.7]]], [[[45.8, 94.4], [46.5, 85.1], [54.6, 80.8], [67.0, 80.3], [77.2, 79.8]]], [[[53.2, 92.0], [52.9, 83.7], [52.9, 76.4], [52.7, 70.8], [52.0, 66.3], [48.0, 64.2], [41.6, 62.9], [37.4, 62.7]]], [[[59.5, 91.8], [54.4, 81.2], [47.8, 73.4], [40.6, 67.6], [34.9, 63.8], [30.1, 59.1]]], [[[50.2, 93.6], [48.3, 81.7], [46.3, 69.1], [44.1, 59.8], [43.8, 56.8]]], [[[39.5, 90.1], [40.3, 73.5], [40.2, 62.9], [40.5, 56.0]]], [[[47.0, 90.9], [50.2, 77.2], [51.2, 68.0], [47.9, 61.6], [39.3, 58.9], [29.2, 57.6]]], [[[53.3, 93.6], [54.0, 83.7], [54.5, 74.3], [54.2, 67.0], [47.4, 63.3], [37.7, 60.9], [31.2, 59.1]]], []];        // 사진마다 바닥 길 선: [[x,y], …] 가까운 곳부터 (사진 크기 대비 %)
const LINE_ONLY = true; // 길 선이 있으면 바닥 화살표 숨기기
const PHOTOS = ["%EC%82%AC%EC%A7%84/1.jpg", "%EC%82%AC%EC%A7%84/1.5.jpg", "%EC%82%AC%EC%A7%84/2.jpg", "%EC%82%AC%EC%A7%84/3.jpg", "%EC%82%AC%EC%A7%84/4.jpg", "%EC%82%AC%EC%A7%84/5.jpg", "%EC%82%AC%EC%A7%84/6.jpg", "%EC%82%AC%EC%A7%84/7.jpg", "%EC%82%AC%EC%A7%84/8.jpg", "%EC%82%AC%EC%A7%84/9.jpg", "%EC%82%AC%EC%A7%84/12.jpg"];      // 사진 경로 (없는 칸은 임시 그림)

const made = new Map();

  const p = toPct(e.clientX, e.clientY);
  if (edit.drag.kind === 'pt') {
    draftOf(state.i).pts[edit.drag.k] = p;
  } else {
    const [x0, y0] = edit.drag.start;
    edit.drag.box = [Math.min(x0, p[0]), Math.min(y0, p[1]), Math.max(x0, p[0]), Math.max(y0, p[1])];
  }
  drawMarks();
  updateEdit();
});
function endDrag(e) {
  if (!edit.drag || e.pointerId !== edit.drag.id) return;
  const g = edit.drag;
  edit.drag = null;
  if (g.kind === 'box' && g.box && g.box[2] - g.box[0] > 1 && g.box[3] - g.box[1] > 0.5) {
    const d = draftOf(state.i);
    touchMarks(d, state.i);
    d.marks.push(g.box);
  }
  render();
}
el.stage.addEventListener('pointerup', endDrag);
el.stage.addEventListener('pointercancel', endDrag);
function undoEdit() {    // 하나 지우기: 길 선은 마지막 점, 깜빡임은 마지막 네모
  const i = state.i, d = draftOf(i);
  if (edit.mode === 'path') { touchPath(d, i); d.pts.pop(); }
  else { touchMarks(d, i); d.marks.pop(); }
  render();
}
function clearEdit() {   // 모두 지우기: 이 사진의 길 선(또는 깜빡임) 전부
  const i = state.i, d = draftOf(i);
  if (edit.mode === 'path') { d.pts = []; d.rest = []; }
  else d.marks = [];
  render();
}
function setMode(mode) { edit.mode = mode; clearTimeout(tipTimer); tipTimer = 0; render(); }
el.modePath.addEventListener('click', () => setMode('path'));
el.modeMarks.addEventListener('click', () => setMode('marks'));
el.editMove.addEventListener('click', () => {
  const low = el.editbox.classList.toggle('low');
  el.editMove.textContent = low ? '▲' : '▼';
  el.editMove.setAttribute('aria-label', low ? '이 상자를 위로' : '이 상자를 아래로');
});
el.editUndo.addEventListener('click', undoEdit);
el.editClear.addEventListener('click', clearEdit);
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* 아래 방법으로 */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;-webkit-user-select:text;user-select:text;';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
function flash(btn, text) {
  btn.dataset.flash = '1';
  btn.textContent = text;
  setTimeout(() => { delete btn.dataset.flash; if (btn === el.editCopy) btn.textContent = '이 줄 복사'; updateEdit(); }, 1600);
}
el.editCopy.addEventListener('click', async () => {
  const ok = await copyText(lineText(state.i));
  flash(el.editCopy, ok ? '복사됨' : 'Ctrl+C');
  if (!ok) { el.editOut.focus(); el.editOut.select(); }
});
el.editCopyAll.addEventListener('click', async () => {
  const ok = await copyText(fileText());
  flash(el.editCopyAll, ok ? '복사됨' : '안 됨');
  clearTimeout(tipTimer);
  el.editTip.innerHTML = ok ? TIP.copied : TIP.failed;
  tipTimer = setTimeout(() => { tipTimer = 0; updateEdit(); }, 9000);
});

/* ── 입력 ── */
el.next.addEventListener('click', () => go(1));
el.prev.addEventListener('click', () => go(-1));
el.paths.addEventListener('click', e => {   // 파란 길을 눌러도 다음 사진으로
  if (!edit.on && e.target.classList && e.target.classList.contains('route')) go(1);
});
el.stage.addEventListener('click', e => { if (!edit.on && !e.target.closest('button, .seek')) nudge(); });
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input')) return;
  if (edit.on && (e.ctrlKey || e.metaKey) && e.code === 'KeyZ') { e.preventDefault(); undoEdit(); return; }
  if (e.code === 'KeyE' && !e.ctrlKey && !e.altKey && !e.metaKey) { e.preventDefault(); setEdit(!edit.on); return; }
  const onButton = e.target.closest && e.target.closest('button');
  if (onButton && (e.key === 'Enter' || e.key === ' ')) return;
  if (['ArrowRight', 'ArrowUp', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(1); }
  else if (['ArrowLeft', 'ArrowDown', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(-1); }
});

/* ── 시작 ── */
restore();
shots[0].style.visibility = 'visible'; shots[0].style.zIndex = 2;
shots[1].style.visibility = 'hidden'; shots[1].style.zIndex = 1;
load(shots[0], state.i);
render();
if (state.i === 0) showHint();
preload(state.i);
</script>
</body>
</html>
